# Publica o app HITSTER PARTY no GitHub Pages a cada push que mexer em hitster-party/.
# Ative uma vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: HITSTER PARTY no GitHub Pages

on:
  push:
    branches: [claude/rpg-universe-site-layout-wzworr, main]
    paths: ['hitster-party/**', '.github/workflows/hitster-party-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hitster-party
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hitster-party/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hitster-party/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
