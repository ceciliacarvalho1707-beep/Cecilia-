<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Nosso Cantinho</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237b3fe4'/%3E%3Cpath d='M9 11h14v9h-8l-4 3v-3H9z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f6f3fb; --surface:#ffffff; --fg:#231a33; --muted:#6f6582;
  --accent:#7b3fe4; --accent-fg:#ffffff; --other:#ece6f6; --line:#e0d8ee; --bad:#c2334d;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16121e; --surface:#1f1a2b; --fg:#eee8f8; --muted:#a49bb6;
  --accent:#9d6bff; --accent-fg:#14091f; --other:#2b2440; --line:#332b47; --bad:#ff7a92; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-size:1.35rem;margin:0;letter-spacing:-.01em}
.status{margin-left:auto;font-size:.8rem;color:var(--muted);white-space:nowrap}
.status::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.status.on::before{background:#2fb36b}
.link{background:none;color:var(--muted);padding:4px 6px;font-weight:500;font-size:.8rem;text-decoration:underline}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-block:16px}
.day{align-self:center;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 6px}
.msg{max-width:78%;display:flex;flex-direction:column;gap:2px;min-width:0}
.msg .who{font-size:.75rem;color:var(--muted);font-weight:600;margin:6px 10px 0}
.bubble{padding:9px 13px;border-radius:18px;background:var(--other);line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .time{font-size:.68rem;color:var(--muted);margin:0 10px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bubble{background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:6px}
.msg:not(.me) .bubble{border-bottom-left-radius:6px}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:30ch;line-height:1.5}
.empty b{display:block;font-family:var(--display);font-size:1.15rem;color:var(--fg);margin-bottom:4px}
#form{display:flex;gap:8px;align-items:flex-end;padding-block:10px;border-top:1px solid var(--line);background:var(--surface)}
textarea,input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:10px 14px}
textarea{flex:1;min-width:0;resize:none;max-height:140px;line-height:1.35}
textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:20px;padding:10px 18px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.note{font-size:.8rem;color:var(--bad);text-align:center;padding:6px 16px}
/* entrada */
#entrar{flex:1;display:flex;align-items:center;justify-content:center;padding-block:32px}
#entrar form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
#entrar h1{font-size:2rem;text-wrap:balance}
#entrar p{margin:0;color:var(--muted);line-height:1.5}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.85rem}
label input{font-weight:400;font-size:15px}
.hint{font-weight:400;color:var(--muted);font-size:.78rem}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em;margin:0}
</style>
</head>
<body>
<div class="app">

  <section id="entrar" class="gut">
    <form id="entrarForm" autocomplete="off">
      <h1>Nosso Cantinho</h1>
      <p>O chat só de vocês duas. Usem a mesma senha para cair na mesma conversa.</p>
      <label>Seu nome
        <input id="nome" maxlength="30" required placeholder="Como você quer aparecer">
      </label>
      <label>Senha da conversa
        <input id="senha" type="password" minlength="8" required placeholder="Pelo menos 8 caracteres">
        <span class="hint">Combinem pessoalmente. Quem souber a senha consegue ler a conversa.</span>
      </label>
      <p class="err" id="entrarErr"></p>
      <button type="submit">Entrar</button>
    </form>
  </section>

  <section id="chat" hidden style="flex:1;display:flex;flex-direction:column;min-height:0">
    <header class="gut">
      <h1>Nosso Cantinho</h1>
      <span class="status" id="status">conectando…</span>
      <button class="link" id="sair" type="button">Sair</button>
    </header>
    <div id="list" class="gut" aria-live="polite"></div>
    <div class="note" id="note" hidden></div>
    <form id="form" class="gut">
      <textarea id="text" rows="1" placeholder="Escreva uma mensagem…" aria-label="Mensagem"></textarea>
      <button id="send" type="submit" disabled>Enviar</button>
    </form>
  </section>

</div>

<script type="module">
// Configuração pública do projeto Firebase (Configurações do projeto → Seus apps → Web).
// Essas chaves não são segredo: quem protege as mensagens são as regras do Firestore.
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  appId: ""
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, limitToLast, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = id => document.getElementById(id);
const KEY = "cantinho:v1";
let db = null, unsub = null, me = null;

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) }catch(_){ return null } }
function save(v){ try{ v ? localStorage.setItem(KEY, JSON.stringify(v)) : localStorage.removeItem(KEY) }catch(_){} }

async function salaDe(senha){
  const bytes = new TextEncoder().encode("nosso-cantinho|" + senha.trim());
  const h = await crypto.subtle.digest("SHA-256", bytes);
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

if (firebaseConfig.projectId){
  db = getFirestore(initializeApp(firebaseConfig));
} else {
  $("entrarErr").textContent = "O site ainda não está ligado ao banco de mensagens.";
}

$("entrarForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!db) return;
  const nome = $("nome").value.trim(), senha = $("senha").value;
  if (!nome){ $("entrarErr").textContent = "Escreva seu nome."; return; }
  if (senha.trim().length < 8){ $("entrarErr").textContent = "A senha precisa ter pelo menos 8 caracteres."; return; }
  const v = { nome, sala: await salaDe(senha) };
  save(v); abrir(v);
});

$("sair").addEventListener("click", () => {
  if (unsub) unsub(); unsub = null; save(null);
  $("senha").value = ""; $("chat").hidden = true; $("entrar").hidden = false;
});

const list = $("list"), text = $("text"), send = $("send"), statusEl = $("status"), note = $("note");
function setNote(t){ note.textContent = t; note.hidden = !t; }
function dayLabel(d){
  const hoje = new Date(), ontem = new Date(); ontem.setDate(hoje.getDate()-1);
  if (d.toDateString()===hoje.toDateString()) return "Hoje";
  if (d.toDateString()===ontem.toDateString()) return "Ontem";
  return d.toLocaleDateString("pt-BR",{day:"numeric",month:"long"});
}

let firstRender = true;
function render(msgs){
  const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
  list.textContent = "";
  if (!msgs.length){
    list.innerHTML = '<div class="empty"><b>Nenhuma mensagem ainda</b>Escreva a primeira aí embaixo. Ela aparece na hora pra vocês duas.</div>';
    return;
  }
  let lastDay = "", lastNome = null;
  for (const m of msgs){
    const d = m.em ? m.em.toDate() : new Date(), day = d.toDateString();
    if (day !== lastDay){ const s=document.createElement("div"); s.className="day"; s.textContent=dayLabel(d); list.appendChild(s); lastDay=day; lastNome=null; }
    const mine = m.nome === me.nome;
    const el = document.createElement("div"); el.className = "msg" + (mine ? " me" : "");
    if (!mine && m.nome !== lastNome){ const w=document.createElement("div"); w.className="who"; w.textContent=m.nome||"Amiga"; el.appendChild(w); }
    const b = document.createElement("div"); b.className="bubble"; b.textContent = m.texto; el.appendChild(b);
    const t = document.createElement("div"); t.className="time"; t.textContent = d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); el.appendChild(t);
    list.appendChild(el); lastNome = m.nome;
  }
  if (atBottom || firstRender){ list.scrollTop = list.scrollHeight; firstRender = false; }
}

function abrir(v){
  me = v; firstRender = true;
  $("entrar").hidden = true; $("chat").hidden = false;
  statusEl.textContent = "conectando…"; statusEl.classList.remove("on");
  const q = query(collection(db, "salas", v.sala, "msgs"), orderBy("em"), limitToLast(300));
  unsub = onSnapshot(q, snap => {
    statusEl.textContent = "ao vivo"; statusEl.classList.add("on"); setNote("");
    render(snap.docs.map(d => d.data({ serverTimestamps: "estimate" })));
  }, err => {
    statusEl.textContent = "erro"; statusEl.classList.remove("on");
    setNote("Não deu pra carregar as mensagens. Confira a internet e recarregue a página.");
    console.error(err);
  });
  text.focus();
}

text.addEventListener("input", () => {
  text.style.height = "auto"; text.style.height = Math.min(text.scrollHeight,140)+"px";
  send.disabled = !text.value.trim();
});
text.addEventListener("keydown", e => {
  if (e.key==="Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches){ e.preventDefault(); $("form").requestSubmit(); }
});
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const v = text.value.trim(); if (!v || !me) return;
  send.disabled = true;
  try{
    await addDoc(collection(db, "salas", me.sala, "msgs"), { texto: v.slice(0,2000), nome: me.nome, em: serverTimestamp() });
    text.value = ""; text.style.height = "auto"; setNote("");
  }catch(err){
    setNote("A mensagem não foi enviada. Confira a internet e tente de novo.");
    send.disabled = false; console.error(err);
  }
  text.focus();
});

const salvo = load();
if (db && salvo && salvo.sala && salvo.nome){ $("nome").value = salvo.nome; abrir(salvo); }
</script>
</body>
</html>
