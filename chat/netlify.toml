# No Netlify, use "chat" como Base directory.
[build]
  publish = "public"
  functions = "netlify/functions"
  # Só publica quando o app muda de verdade (cada publicação gasta créditos).
  # Mudanças só em outros arquivos (como o supabase.sql) são puladas.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public netlify package.json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
